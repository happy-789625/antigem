name: Build Standard AntiGem APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Dummy Keystore
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AntiGem, OU=Dev, O=AntiGem, L=City, S=State, C=US"

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          if [ -d "scripts" ]; then chmod -R +x scripts/; fi

      - name: Build APKs with Official Script
        run: |
          if [ -f "scripts/build_all_apks.sh" ]; then
            ./scripts/build_all_apks.sh --release || ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antigem-apks
          path: |
            output/**/*.apk
            app/build/outputs/apk/**/*.apk
            build/outputs/**/*.apk
            
