name: Build Standard AntiGem APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          if [ -d "scripts" ]; then chmod -R +x scripts/; fi

      - name: Build Standard Debug APK
        run: |
          if [ -f "scripts/build_all_apks.sh" ]; then
            # Run the project build script in debug mode to bypass missing keystore
            ./scripts/build_all_apks.sh --debug || ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antigem-standard-apk
          path: |
            output/**/*.apk
            app/build/outputs/apk/**/*.apk
            
